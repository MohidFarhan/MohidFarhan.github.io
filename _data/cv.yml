    Research Experience:
      - company: Independent Researcher
        position: Multi-Component Dark Sector Frameworks
        location: Islamabad, Pakistan
        start_date: 2025-10
        end_date: "present"
        summary: Developing cosmological frameworks that resolve low-redshift tensions through structured dark-sector dynamics.
        highlights:
          - Developed the LDS-SF framework to resolve the S8 tension via scale-dependent growth from dark-sector perturbation matrices
          - Implemented a Z4-symmetric Inert Doublet-Singlet Model in CLASS and micrOMEGAs, mapping microscopic interactions to an effective sound speed
          - Derived two-loop Renormalization Group Equations for singlet mass parameters ensuring radiative stability of the dark energy scale
          - Studied Momentum Exchange Dark Matter–Dark Energy interactions through CLASS

      - company: Institute of Space Technology
        position: Theoretical Physics Researcher (Final Year Project)
        location: Islamabad, Pakistan
        start_date: 2024-07
        end_date: "present"
        summary: Led an advanced theoretical investigation into dark matter and dark energy unification frameworks.
        highlights:
          - Explored extensions of the Standard Model including the Three-Higgs Doublet Model and the Inert Doublet plus Singlet Model
          - Used SARAH, SPheno, micrOMEGAs, CalcRGE, and FeynCalc to compute observables, relic densities, and parameter dependencies
          - Conducted comparative analysis of dark matter relic density topology across IDM, MSSM, and NMSSM

