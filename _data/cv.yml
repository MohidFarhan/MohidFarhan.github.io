    Experience:
      - company: Independent Researcher, Multi-Component Dark Sector Frameworks
        position: Independent Researcher
        location: Islamabad, Pakistan
        start_date: 2025-10
        end_date: "present"
        summary: Developing cosmological frameworks that resolve low-redshift tensions through structured dark-sector dynamics.
        highlights:
          - Helped develop the LDS-SF framework to resolve the S8 tension through scale-dependent growth derived from dark sector perturbation matrices
          - Provided the cosmological framework with a particle physics foundation by implementing a Z4-symmetric Inert Doublet Singlet Model (Z4-IDSM) in C-based software like CLASS and micrOMEGAs, mapping microscopic interactions to an effective sound speed (c_s^2)
          - Derived up to two-loop Renormalization Group Equations (RGEs) for singlet mass parameters to ensure the radiative stability of the dark energy scale
          - Mapped the model's cosmological effects in CLASS to study Momentum Exchange Dark Matter-Dark Energy Interactions

      - company: Theoretical Physics Researcher, Final Year Project and Independent Extension
        position: Theoretical Physics Researcher
        location: Islamabad, Pakistan
        start_date: 2024-07
        end_date: "present"
        summary: Led an advanced theoretical investigation into dark matter and dark energy unification frameworks.
        highlights:
          - Explored extensions of the Standard Model such as the Three-Higgs Doublet Model (3HDM) and the Inert Doublet plus Singlet Model (IDSM)
          - Utilized computational and symbolic tools including SARAH, SPheno, micrOMEGAs, CalcRGE, and FeynCalc to compute observables, relic densities, and parameter dependencies
          - Conducted comparative computational analysis of dark matter relic density topology across IDM, MSSM, and NMSSM

      - company: National Centre for Physics (NCP)
        position: Internee
        location: Islamabad, Pakistan
        start_date: 2023-07
        end_date: 2023-09
        summary: Worked on matter-radiation interactions on a project titled "Shielding Against Cosmic Rays and Solar Energetic Particles for Spacecrafts."
        highlights:
          - Analyzed particle flux models, attenuation behavior of shielding materials, and CMB photon interaction limits relevant to long-duration missions
          - Contributed to simulations estimating dose deposition and evaluating mitigation strategies under varying orbital and interplanetary conditions

      - company: National Center for GIS and Space Applications
        position: Internee
        location: Islamabad, Pakistan
        start_date: 2024-07
        end_date: 2024-09
        summary: Acquired hands-on experience in astronomical data acquisition and analysis, focusing on telescopic observations and image processing.
        highlights:
          - Worked with BASS Project, Registax, PIPP, Siril, Stellarium, AstroImageJ, N.I.N.A and Astroplanner for calibration, reduction, and analysis of stellar and planetary data
          - Performed spectroscopic and photometric measurements to extract stellar parameters such as temperature and composition

